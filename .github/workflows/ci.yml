name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Test, format, and lint (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform that fails must not hide the result of the others. The
      # matrix exists to show where a difference is, and a stop at the first
      # failure throws that away.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ffmpeg, espeak-ng and Pillow are installed on one platform only. What
      # they do does not differ by operating system, so paying for them three
      # times buys nothing, and without them everywhere those tests only skip.
      - name: Install ffmpeg and espeak-ng
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install the project
        run: uv sync --python ${{ matrix.python }}

      - name: Install the drawing group
        if: matrix.os == 'ubuntu-latest'
        run: uv sync --python ${{ matrix.python }} --extra video

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
