name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Test, format, and lint (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform that fails must not hide the result of the others. The
      # matrix exists to show where a difference is, and a stop at the first
      # failure throws that away.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --python ${{ matrix.python }}

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
