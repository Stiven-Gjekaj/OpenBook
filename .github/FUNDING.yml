# GitHub reads this file to put a Sponsor button at the top of the repository
# page. The button in README.md is a separate thing and reaches the same page
# by its address, so a change of name here is a change there as well.
#
# Ko-fi also gives a panel a short id, and a button written that way carries
# the id instead of the name. This one carries the name, because the two are
# the same destination and one identifier is easier to keep true than two.
ko_fi: stivengjekaj
