<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="openbook-title">
  <title id="openbook-title">OpenBook</title>

  <!-- The sound above the page, drawn as a level meter. Arcs were tried first
       and read as a rainbow resting on the cover. Bars of uneven height read
       as sound at any size. -->
  <g stroke="#F59E0B" stroke-width="13" stroke-linecap="round">
    <path d="M 62 52 L 62 80" />
    <path d="M 84 40 L 84 92" />
    <path d="M 106 26 L 106 106" />
    <path d="M 128 18 L 128 114" />
    <path d="M 150 30 L 150 102" />
    <path d="M 172 42 L 172 90" />
    <path d="M 194 53 L 194 79" />
  </g>

  <!-- The open book. The covers are drawn apart from the fold, so the fold
       stays visible when the logo is small. -->
  <g fill="#4F46E5" fill-opacity="0.10" stroke="#4F46E5" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 128 152 C 106 134, 70 128, 34 132 L 34 226 C 70 222, 106 228, 128 246 Z" />
    <path d="M 128 152 C 150 134, 186 128, 222 132 L 222 226 C 186 222, 150 228, 128 246 Z" />
  </g>
  <path d="M 128 152 L 128 246" fill="none" stroke="#4F46E5" stroke-width="13"
        stroke-linecap="round" />
</svg>
