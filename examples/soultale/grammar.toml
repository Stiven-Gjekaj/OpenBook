# Grammar for the Soultale manuscript.
#
# The source is a set of EPUB files. Each rule here is checked against all 325
# chapters of the book. The comments give the counts that the check found.


[source]
format = "epub"

# The book comes in more than one EPUB file. Each file contains the archive
# chapter, so two files can hold the same chapter. The parser uses the chapter
# number to find a chapter that it already has, and it keeps the first one.
files = [
  "book/soultale-definitivus-pt-1_394040019.epub",
  "book/soultale-definitivus-pt-2_411510912.epub",
]

# The reading order comes from the spine of each EPUB. The parser does not sort
# file names, because the file names contain a time value and not a chapter
# number.
#
# The chapter title comes from the navigation document. The same string is also
# in the <title> element and in the <h1> element of each chapter. All three
# agree in all 325 chapters. Some titles start with a space, so the parser
# removes the space at each end before it reads the title.
chapter_title = "(Chapter {NUMBER} || {VOLUME}) {TITLE}"
number_pattern = '-?\d+'
volume_pattern = '[^)]+'

# The parser reads a chapter that has one of these volume names, but it does
# not put the chapter in the audiobook.
#
# Two chapters match. The three prologue chapters do not match. The audiobook
# contains them.
skip_volume_pattern = '^Archive'

# The narrator says this at the start of a chapter. The raw title contains two
# vertical bars, and the speech engine speaks them.
#
# The second form is for a volume whose name holds no number. Soultale gives it
# the same words as the first, so that a prologue chapter is announced as
# "Chapter 0." and the card under the title can say the same number. Give it
# "{VOLUME}. {TITLE}" instead to hear "Prologue." there.
chapter_announcement       = "Chapter {NUMBER}. {TITLE}"
chapter_announcement_named = "Chapter {NUMBER}. {TITLE}"


[grammar]

# Dialogue.
#
# The real form in the EPUB is:
#   <strong>LEA</strong>: My papa's going to ask why I was out so late.
#
# The exporter uses two elements for bold text and gives them the same meaning.
# The parser must accept both.
dialogue_elements = ["b", "strong"]

# The parser removes the element, then applies this template to what is left.
#
# A bold element is a speaker code only when it starts a segment and a colon
# comes after it. A bold word inside a sentence is emphasis. See the note on
# text style.
dialogue = "{SPEAKER}: {TEXT}"

# The speaker code.
#
# The book contains 187 different codes. Most codes are 2 to 4 capital letters.
# The class must also accept these codes, which are real:
#
#   ???  ///  JHN?  PR1  PR2  PR3  GD1  GD2  SC2
#   KID #1  KID #2  NEWS ANCHOR  CUSTOMER  GABRIEL  PROC  NER & SHN
#
# The class accepts no lowercase letter.
speaker_pattern = '[A-Z0-9?/#&][A-Z0-9?/#& ]{1,13}'

# A paragraph can hold more than one dialogue line. The lines are divided by a
# line break element and not by a paragraph element. This is common. The parser
# divides each paragraph at every line break before it looks for a speaker.
split_at_line_break = true

# An action inside a line of dialogue.
#
# The author writes an action between two asterisks, inside the words of the
# character:
#
#   **RMI**: You want to try that again? *circling remi warily*
#
# There are 46 of these. 40 of them are in volume 1 and the other six are in
# volume 2. No later volume uses one.
#
# They divide into two kinds. Some change how the line sounds: *cough*,
# *sniffling*, *whispered*. Some tell the reader where the character looks or
# what they do: *to his assistant*, *answering phone*, *hanging up*. Neither
# kind is part of the sentence, so neither kind can be spoken as words.
#
# The pattern uses the asterisks and not the italic elements. Italic marks
# emphasis in this book, and the renderer removes it. See strip_elements.
action = '\*(?P<TEXT>[^*\n]{1,80})\*'


[grammar.unison]
# Two characters can speak one line together:
#   <strong>NER &amp; SHN</strong>: text
#
# The ampersand is an XML entity in the file. The parser must decode the entity
# before it looks for the separator.
separator = " & "

#   voice_blend  Make one new voice from the average of the style vectors of
#                the two characters. Then speak the line one time. One voice
#                comes out, and it is neither of them.
#   mix          Speak the line one time for each character, and lay the two
#                pieces of audio over each other. Both voices are heard, and
#                both characters keep their own. The two start together and
#                the shorter reading stops first.
#   mix_matched  The same, with both readings brought to one length first, so
#                they speak together from the first word to the last.
#   primary      Use the voice of the first character only.
#
# mix_matched changes how fast a character talks, which is why it is asked for
# and never assumed. Measured on Kokoro with af_heart and am_michael, on lines
# of one, six and fifteen words:
#
#   mix          the readings end 0.07s, 0.35s and 0.60s apart
#   mix_matched  they end together, and no voice moves more than 8.7 percent
#
# The length they are brought to is the average of the two, so neither reading
# carries the whole change. Moving one of them the whole way would move it
# twice as far, and a tempo moved 7 percent is near the point where nobody
# hears it while 14 percent is not.
mode = "mix_matched"


[grammar.structure]

# End matter. The exporter puts it in an underline element. The element is
# consistent even when the words are not, so the parser uses the element and
# does not read the text.
end_matter_element = "u"

# The last line of a closing, which does not wear that element. Soultale
# underlines 'End of Chapter 4' and the name of the chapter, then leaves a line
# in brackets under them in bold alone. The element alone would give that line
# to the narration, and turning the closing off would leave it talking on its
# own. It counts only where a closing has already begun, because a bracketed
# line in the middle of a chapter is something else entirely.
#
# The lines of a closing are then read as one. The book puts them on separate
# lines because that is how they sit on a page; a reader still says them as a
# single sentence falling to its end.
end_matter_tail = '^\[.*\]$'

# A scene break. The author writes a short line of dashes. The renderer makes a
# pause here and speaks nothing. Without this rule the narrator says the name
# of each dash.
scene_break = '^\s*-{3,}\s*$'

# Text style.
#
# Bold and italic mark emphasis. In rare places they mark the words of one
# character inside the narration. Neither changes the voice and neither changes
# the pronunciation, because the speech engine gets the same sounds from the
# same letters. Stress comes from the words of the sentence and not from the
# style of the text.
#
# The parser therefore removes these elements and keeps the text inside them.
# The exception is a bold element that holds a speaker code.
strip_elements = ["i", "em", "b", "strong", "span", "a"]

# Paragraph alignment is also not a signal. 75 percent of all paragraphs are
# centred, and many chapters are centred from start to end. The parser ignores
# alignment.


[render]
read_chapter_names = true

# The end of a chapter.
#
# Every chapter closes with three lines. Two of them are in the underline
# element and the third is not:
#
#   End of Chapter 0
#   "Point - Null"
#   [ The 1 named 0. ]
#
# With this false only the third was read, so the closing line arrived with
# nothing in front of it. Read together they are the natural close: the
# chapter is named, then its title, then the line that comments on it.
read_end_matter    = true

# Pauses.
#
# A pause happens only where the kind of the text changes. Two dialogue lines
# that come one after the other get no pause, because the conversation must
# stay quick. Two narration paragraphs that come one after the other get no
# pause for the same reason.
#
# The speech engine still makes its own short stop at the end of a sentence.
# These values add silence after that stop.
pause_dialogue_to_narration = "400ms"
pause_narration_to_dialogue = "600ms"
pause_at_scene_break        = "2s"
pause_after_chapter_name    = "1s"

# The rest between one chapter and the next. It falls after the closing line
# and before the next chapter is announced, so it is the only silence a
# listener gets to take in what happened.
pause_between_chapters      = "3s"

# An action inside a line of dialogue.
#
#   pause     Take the action out and leave a silence where it was. The line
#             keeps its rhythm and the character does not say the word "cough".
#   narrator  The narrator speaks the action. This suits an action that tells
#             the reader where a character looks, and it interrupts a short
#             line badly.
#   drop      Take the action out and leave nothing.
#
# Dropped. 45 of the book's 48 actions say where a character looks or what
# they are doing while they speak: 'to his assistant', 'answering phone'.
# Those are directions to an actor and a listener is not owed them. The other
# three are a sigh and two coughs, and no mode tells one kind from the other.
# They fall in 19 chapters of 192, twelve of them in chapter 15 alone.
action          = "drop"
pause_at_action = "500ms"


[output]
# One audiobook for each volume. The EPUB files are not a guide here. Part 1
# holds volume 1 to the middle of volume 6, so a file for each part would cut
# volume 6 in two.
#
# The renderer puts the chapters in order of chapter number, and it makes one
# chapter mark for each chapter.
group_by  = "volume"
file_name = "Soultale - {VOLUME}.m4b"

# How the sound is written into the file.
#
# The engine makes 24000 samples a second in one channel, which is right for
# speech and right for a download. These keys change that on the way out, and
# they change nothing that the cache holds.
#
# Leave them at 0 for a download. Raising the rate adds no information to
# speech and only makes the file larger.
#
# For YouTube, set them to 48000 and 2. YouTube changes whatever it is given,
# and doing the change here means it happens one time and with a good filter
# rather than twice.
bitrate     = "64k"
sample_rate = 0
channels    = 0

# Bring the speech to the loudness an audiobook is expected to have, which is
# -19 LUFS with a true peak no higher than -3 dB.
#
# A volume quieter than the one before it means reaching for the dial at the
# start of every part, and an uploaded file cannot be corrected. Turn this off
# only if something else levels the audio later.
level = true

# The three prologue chapters are chapter 0, 1 and 2. They come before chapter
# 3, so the order inside the file stays correct.
[output.merge_volumes]
"Prologue" = "Volume 1"

# THE VIDEO
#
# A card is drawn for each chapter, and the card names the volume above the
# work and the chapter below it. Every colour is a default the drawing code
# holds, so only the fonts and the words are named here.

[output.parts]

# A run of chapters that becomes its own file, and its own video.
#
# The prologue is chapters 0 to 3. It goes out first and on its own, so it
# needs a file of its own and a name of its own. Volume 1 then starts at
# chapter 4.
#
# A part wins over the volume that holds it. The chapters stay in Volume 1
# everywhere else: in the book, in the chapter list, and in the numbers the
# narrator speaks.
Prologue = "0-3"


[video]
file_name       = "Soultale - {VOLUME}.mp4"
title           = "SOULTALE"

# Two files draw one face. The back holds the pixels that sit behind the
# letters and the fore holds the letters themselves.
title_font      = "fonts/MonsterFriendFore.otf"
title_back_font = "fonts/MonsterFriendBack.otf"
body_font       = "fonts/determination.ttf"
background      = "#12101F"

# A still card each second is enough, because nothing on a card moves.
framerate       = 1
bitrate         = "192k"
sample_rate     = 48000
channels        = 2

# What goes above the chapter times.
#
# YouTube shows about the first 150 characters before it folds the rest away,
# so the line that has to earn a listener comes first and the housekeeping
# comes last. The chapter times are added under this, one for each chapter,
# and YouTube turns them into the chapter marks on the player itself. That
# needs the first time to read 0:00, which the writer takes care of.
#
# The link is the series as a reader sees it. The address with /write/ in it
# is the authoring view, which opens for the author and for nobody else, so a
# reader who followed it from a video would arrive nowhere. Open the link in a
# browser that is not signed in before a volume goes up.
description = """
True strength is not measured by who you can defeat. It is defined by who you
choose not to destroy.

Volume 1, The Ascension. A world begins again, and the people who will decide
its shape arrive one at a time: a thread weaver, an oathkeeper, a doctor of
lies. None of them yet knows what is going to be asked of them.

Read Soultale on Wattpad: https://www.wattpad.com/series/163487
Written by n1cetry.
"""

# How many words of the opening to quote under the description. About forty
# runs to a few hundred characters, which is enough to catch somebody and
# short enough to leave the chapter times visible without unfolding the rest.
# The quote stops at the end of a sentence rather than in the middle of one,
# and it is taken from the opening, so it can give nothing away.
peek_words      = 45

# The licence of the body face asks to be named, and this is where it is
# named. Putting it here means it cannot be remembered on the first volume and
# forgotten on the ninth.
credits = [
  "Determination by anonymous-1438277, licensed CC BY 3.0",
  "https://fontstruct.com/fontstructions/show/2368299",
]
