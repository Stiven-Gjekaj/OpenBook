# How a word is said.
#
# The name of an entry is the word as the book writes it, and the value is a
# respelling that an engine reads correctly. The match is on whole words and
# it ignores case, so one entry answers every place the book uses the word.
#
# This applies before a line is divided and before a correction, so it reaches
# every line of the book, the intro and the outro included. That matters most
# for a name, which the intro is likely to say.
#
# A respelling ends up in the captions as well as in the sound, because both
# come from the words the engine was given. Prefer a spelling a reader would
# not stumble over.
#
# 'openbook words' names every word the phonemizer does not have, and
# 'openbook words --merge' adds the new ones without touching the answers
# already here.

[words]

# The book writes 'Woah'. The word is 'whoa', and an engine given 'Woah' reads
# it as two syllables that rhyme with 'Noah'.
Woah = "whoa"

# The book elides, and a model reads the mark rather than the elision. The
# apostrophe comes out and the word stays casual.
#
# There is no entry for "ya'". Taking its mark off made the line worse rather
# than better: the gap around the word grew from 0.81 to 1.07 seconds, which
# is the model saying "call... ya... Zero" and is what a listener heard. The
# word itself is the trouble, not its mark, so that line is answered in
# corrections.toml where the whole of it can change.
"'bout" = "bout"

# 'ol' is 'old' with the d gone, and is said 'ole'. Written 'ol' a model reads
# it to rhyme with 'doll'.
"ol'" = "ole"

# Six places in the book, and a model pauses at the hyphen and says two
# things. The whole term is one word to a reader and now one word to the
# engine. The halves keep their own entries: nothing here names 'Ink' or
# 'sphere', so 'Thread-Weaver' and the rest still divide as they did.
"Ink-sphere" = "Inksphere"
