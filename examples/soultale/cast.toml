# Cast for Soultale.
#
# This file holds every speaker code that Volume 1 uses. Volume 1 contains the
# three prologue chapters and chapters 3 to 22. It has 44 codes and 687
# dialogue lines.
#
# The build stops when a chapter uses a code that this file does not have. The
# error names the code and the chapter. Add the code here, then build again.
#
# Give each entry a name and a voice. The name is for you and for the reports.
# The renderer uses the voice.
#
# What a voice is depends on the engine that speaks it:
#
#   chatterbox   A path to a recording of the character, read from this
#                directory: "voices/black.wav". Ten to twenty seconds of clean
#                speech is enough, and what is in the recording is what comes
#                out, including the room it was recorded in.
#   kokoro       One of its own names, such as "af_heart". The first letter
#                says the accent: a for American, b for British.
#   espeak       A language and a variant: "en-us", "en-gb+Alicia".
#
# 'openbook check --engine chatterbox' says which recordings are not there
# yet, so a missing one is found before a render and not after it.
#
# HOW MUCH FEELING
#
# An engine that reads with feeling takes an exaggeration. Narration gets 0.3
# and dialogue gets 0.7, because a narrator holds one level for hours and a
# character in a fantasy is frightened, or lying, or giving an order. One
# value for both gives a theatrical narrator or a flat cast.
#
# Add 'exaggeration' to an entry to say something else about one character:
#
#   [cast.BLK]
#   voice        = "voices/black.wav"
#   exaggeration = 0.85
#
# Leave it out and the kind of the line decides. It is part of the key of each
# line, so changing it for one character remakes that character and nobody
# else, and changing the number for dialogue leaves the narration alone.


[narrator]
# The narrator speaks 79 percent of the book. Choose this voice first, and
# listen to it for several minutes before you accept it. This is also the one
# voice where a wandering model costs most, because it reads a third of a
# million words and a dropped one is found only by listening.
voice = ""


