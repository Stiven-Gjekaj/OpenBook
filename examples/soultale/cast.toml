# UNKNOWN SPEAKERS
#
# The code ??? is not one character. It is a different character in each part
# of the book, so it cannot have one entry.
#
# Give it one entry for each group of chapters. The renderer finds the entry
# from the chapter number. A ??? line in a chapter that no entry covers stops
# the build, which is correct: a new unknown character needs a new voice.
#
# Volume 1 has no ??? line, so these entries are for later volumes:
#
#   [[cast_range."???"]]
#   chapters = "38"
#   name     = ""
#   voice    = ""
#
#   [[cast_range."???"]]
#   chapters = "115-120"      # 51 lines, the largest group
#   name     = ""
#   voice    = ""
#
# The other groups are chapter 73, chapter 128, and chapter 175.
#
# A group can use the voice of a character that the story names later. The
# listener then hears the connection when they read the book again. Or the
# group can keep a voice of its own. Choose this for each group.
