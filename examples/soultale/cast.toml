# Cast for Soultale.
#
# This file holds every speaker code that Volume 1 uses. Volume 1 contains the
# three prologue chapters and chapters 3 to 22. It has 46 codes and 687
# dialogue lines.
#
# The build stops when a chapter uses a code that this file does not have. The
# error names the code and the chapter. Add the code here, then build again.
#
# Give each entry a name and a voice. The name is for you and for the reports.
# The renderer uses the voice.


[narrator]
# The narrator speaks 79 percent of the book. Choose this voice first, and
# listen to it for several minutes before you accept it.
voice = ""


# LEADS
#
# Two codes carry most of the dialogue of the volume. Give each one a voice
# that no other character uses.

# 160 lines. First in chapter 4.
[cast.BLK]
name  = ""
voice = ""

# 54 lines. First in chapter 0.
[cast.INK]
name  = ""
voice = ""


