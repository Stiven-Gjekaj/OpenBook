# Cast for Soultale.
#
# This file holds every speaker code that the prologue and Volume 1 use. The
# prologue is chapters 0 to 2 and Volume 1 is chapters 3 to 22. Together they
# have 44 codes and 687 dialogue lines.
#
# The build stops when a chapter uses a code that this file does not have. The
# error names the code and the chapter. Add the code here, then build again.
#
# Give each entry a name and a voice. The name is for you and for the reports.
# The renderer uses the voice.
#
# What a voice is depends on the engine that speaks it:
#
#   chatterbox   A path to a recording of the character, read from this
#                directory: "voices/blook.wav". Ten to twenty seconds of clean
#                speech is enough, and what is in the recording is what comes
#                out, including the room it was recorded in.
#   chatterbox-turbo
#                The same paths, through a newer model that reads several
#                times faster, holds one loudness by itself, and takes five
#                seconds of reference instead of twenty.
#   kokoro       One of its own names, such as "af_heart". The first letter
#                says the accent: a for American, b for British.
#   espeak       A language and a variant: "en-us", "en-gb+Alicia".
#
# 'openbook check --engine chatterbox' says which recordings are not there
# yet, so a missing one is found before a render and not after it.
#
# HOW MUCH FEELING
#
# An engine that reads with feeling takes an exaggeration. What it means
# depends on the model, because they do not agree on where flat is.
#
#   chatterbox        0.3 narration, 0.7 dialogue.
#   chatterbox-turbo  0.5 for both, and it does nothing to the sound.
#
# The older pair says that a narrator holds one level for hours while a
# character in a fantasy is frightened, or lying, or giving an order.
#
# Turbo ignores the number. One line read at 0.0, 0.5 and 1.0 from one seed
# comes back bit for bit the same, so the setting cannot make this model read
# with more feeling. It is still part of the key of a line, so changing it
# gives a different reading of that line, and the two kinds share one number
# because this model draws no line between them.
#
# A feeling on Turbo comes from a tag in corrections.toml, [happy] or [fear]
# and the rest. That is the only thing it listens to.
#
# DO NOT WRITE 'exaggeration' FOR A NEW CHARACTER while Turbo is the engine.
#
# It cannot do the thing its name promises. What it still does is change the
# key of every line that character says, so writing one makes that character
# again and gives you a different reading, which is not what somebody adding
# a voice is asking for. Give the character a recording and stop there.
#
#   [cast.BLK]
#   voice = "voices/blook.wav"
#
# One entry below has a number, and it stays only because the lines it made
# are made and were listened to. Removing it now would remake them for no
# gain. Read that entry as history rather than as an example.
#
# On the older chatterbox engine the number means what it says. Leave it out
# and the kind of the line decides. It is part of the key of each line, so
# changing it for one character remakes that character and nobody else, and
# changing the number for dialogue leaves the narration alone.


[narrator]
# The narrator speaks 79 percent of the book. Choose this voice first, and
# listen to it for several minutes before you accept it. This is also the one
# voice where a wandering model costs most, because it reads a third of a
# million words and a dropped one is found only by listening.
#
# A recording, so this needs '--engine chatterbox-turbo'. Everything the
# recording carries comes out in the reading: the accent, the pace, and the
# room it was made in.
voice = "voices/narrator.wav"


# A narrator for a run of chapters, where the telling changes hands.
#
# Soultale does not keep one narrator. The prologue is told from outside: no
# first person in all 5,306 words of its narration. Chapter 3 opens in the
# first person and never goes back, and that voice is Blook, so the narrator
# of Volume 1 and the voice of BLK are one person and take one recording.
# Later volumes change again, chapter by chapter, to whoever the point of
# view belongs to.
#
# A range wins over [narrator] above, which answers for every chapter no
# range covers. Two ranges over one chapter are refused.
#
#   [[narrator_range]]
#   chapters = "3-22"
#   name     = "Blook"
#   voice    = "voices/blook.wav"
#
# Nothing here yet. Volume 1 is not cast, and writing a range before the
# recording exists would only move where the build stops.


[host]
# The voice that speaks to the listener rather than inside the book. It reads
# the intro and the outro, where the video says hello and asks for a
# subscription.
#
# It is not a character and it is not in the cast, because nobody in the book
# ever hears it. Leave this out and the narrator reads those words, which is
# what happened before this entry existed.
voice = "voices/host.wav"


# LEADS
#
# Two codes carry most of the dialogue of the volume. Give each one a voice
# that no other character uses.

# 160 lines. First in chapter 4.
[cast.BLK]
name  = "Blook"
voice = ""

# 54 lines. First in chapter 0.
[cast.INK]
name         = ""
voice        = "voices/ink.wav"
# Written when this number was thought to set how much feeling a character
# reads with. It does not, on this engine. It is left alone because these 54
# lines are made and have been heard, and removing it would change the key and
# make them all again. Do not copy it into a new entry.
exaggeration = 0.4


