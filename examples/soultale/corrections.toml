# Lines that came out wrong, and the words to give the engine instead.
#
# The name of an entry is the line as the review page showed it. A correction
# lands after the lexicon and after a long line is divided, so what is written
# here is what the page displayed and what the engine was handed.
#
# Only the marked line is made again. The text is part of its key, so changing
# the words remakes that one piece and the rest of the volume keeps its audio.
#
# The reading is also seeded from the text, so any change to the words gives a
# different reading and not the same one with a patch on it. That is why an
# entry that repeats its own line is refused: it would make the same audio
# under the same key, and look like a correction that did not take.

[corrections]

# The 'Wh' came out as a hard G, so the line opened on 'Goo are you'. It is
# the first thing this character says and three words long, which is where a
# model that makes a token at a time has the least to steady itself with.
#
# Three dots fixed the sound and bought a gap too long to be hesitation. A
# dash asks for a shorter break, and if the model gives it no weight at all
# the line is the one the book wrote, read from a different seed, which was
# most of what the first correction was worth.
"Who are you?" = "Who — are you?"

# FEELING
#
# A tag tells the engine how to read a line. It is an instruction and not
# words, so the captions take it out again and a viewer never sees it.
#
# The tags belong to the engine. These are Turbo's. The older Chatterbox model
# spells several of them differently and would read these as letters.
#
# Only where the words leave no doubt. A tag on a line that could be read two
# ways replaces the author's ambiguity with a guess.

# Said twice at 1.92s, where every other short line of this character
# runs 0.60 to 1.16. A one word line is where a model that makes a token
# at a time repeats itself, and a re-roll is the only answer. The capital
# does that and gives a caption that reads as it should.
"whoa!" = "[surprised] Whoa!"
"Perfect!" = "[happy] Perfect!"
"Finally, someone newer than me around here!" = "[happy] Finally, someone newer than me around here!"
"Even guardians can have fun!" = "[happy] Even guardians can have fun!"
"Well, you've got the best teacher right here! The Magnificent Blueberry is an expert in fun!" = "[happy] Well, you've got the best teacher right here! The Magnificent Blueberry is an expert in fun!"
"Don't look directly at them!" = "[fear] Don't look directly at them!"
"Zero, no!" = "[fear] Zero, no!"
"No!" = "[angry] No!"
"I am the true strongest!" = "[dramatic] I am the true strongest!"
"All resistance ends." = "[dramatic] All resistance ends."
